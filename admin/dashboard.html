<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Fold Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="dashboard.html" class="logo">Fold</a>
      <nav class="main-nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="orders.html">Orders</a>
      </nav>
      <div class="header-right">
        <span class="user-info" id="user-info"></span>
        <button class="btn btn-sm btn-outline logout-btn" onclick="handleLogout()">Log Out</button>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Store overview</p>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Products</div><div class="stat-value" id="stat-products">—</div></div>
      <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="stat-orders">—</div></div>
      <div class="stat-card"><div class="stat-label">Pending Orders</div><div class="stat-value" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value" id="stat-revenue">—</div></div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const res = await fetch('/api/admin/dashboard');
        const data = await res.json();
        document.getElementById('stat-products').textContent = data.totalProducts;
        document.getElementById('stat-orders').textContent = data.totalOrders;
        document.getElementById('stat-pending').textContent = data.pendingOrders;
        document.getElementById('stat-revenue').textContent = data.totalRevenue.toLocaleString() + ' EGP';
      } catch (err) {
        console.error('Failed to load dashboard:', err);
      }
    }
    loadDashboard();

    function handleLogout() {
      localStorage.removeItem('admin_token');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
